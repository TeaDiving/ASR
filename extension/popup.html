<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Interpreter</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 16px;
        color: #17202a;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f6f7f9;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      form {
        display: grid;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 12px;
        font-weight: 700;
        color: #657282;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #d7dde5;
        border-radius: 6px;
        padding: 9px;
        font: inherit;
        font-size: 13px;
        background: #ffffff;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        height: 36px;
        border: 0;
        border-radius: 6px;
        background: #1769aa;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #495766;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .status {
        min-height: 18px;
        font-size: 12px;
        color: #657282;
      }

      .status.error {
        color: #b42318;
      }

      .result {
        display: none;
        padding: 10px;
        border-radius: 6px;
        background: #eef8f1;
        font-size: 13px;
        line-height: 1.45;
      }

      .result.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>AI Interpreter</h1>
    <form id="settings-form">
      <label>
        Backend URL
        <input id="backend-url" name="backendUrl" value="http://127.0.0.1:8765" required />
      </label>
      <label>
        APPID
        <input id="app-id" name="appId" autocomplete="off" required />
      </label>
      <label>
        APIKey
        <input id="api-key" name="apiKey" autocomplete="off" required />
      </label>
      <label>
        APISecret
        <input id="api-secret" name="apiSecret" autocomplete="off" required />
      </label>
      <label>
        English test text
        <textarea id="source-text" name="text">Good morning everyone.</textarea>
      </label>
      <div class="actions">
        <button id="save-button" type="button" class="secondary">Save API</button>
        <button id="overlay-button" type="button" class="secondary">Show Overlay</button>
        <button id="translate-button" type="submit">Translate</button>
        <button id="hide-button" type="button" class="secondary">Hide Overlay</button>
      </div>
      <div id="status" class="status" role="status"></div>
      <div id="result" class="result"></div>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
