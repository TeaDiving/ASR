<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASR Translation Plugin</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #17202a;
        --muted: #657282;
        --line: #d7dde5;
        --primary: #1769aa;
        --primary-dark: #0f4f86;
        --danger: #b42318;
        --success-bg: #eef8f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      }

      .plugin-shell {
        width: min(760px, calc(100vw - 32px));
        margin: 32px auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 16px 48px rgba(23, 32, 42, 0.08);
        overflow: hidden;
      }

      header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      form {
        display: grid;
        gap: 16px;
        padding: 24px;
      }

      .credential-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        background: #ffffff;
        font: inherit;
        font-size: 14px;
        outline: none;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      input {
        height: 40px;
        padding: 0 11px;
      }

      textarea {
        min-height: 130px;
        resize: vertical;
        padding: 11px;
        line-height: 1.45;
      }

      input:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.16);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: var(--primary);
        color: #ffffff;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .status {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      .result {
        display: none;
        margin: 0 24px 24px;
        padding: 16px;
        border: 1px solid #cfe6d5;
        border-radius: 8px;
        background: var(--success-bg);
      }

      .result.is-visible {
        display: grid;
        gap: 12px;
      }

      .result h2 {
        margin: 0;
        font-size: 16px;
      }

      .result-block {
        display: grid;
        gap: 6px;
      }

      .result-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .result-text {
        margin: 0;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .error {
        color: var(--danger);
      }

      @media (max-width: 720px) {
        .plugin-shell {
          width: min(100vw - 20px, 760px);
          margin: 10px auto;
        }

        .credential-grid {
          grid-template-columns: 1fr;
        }

        header,
        form {
          padding: 18px;
        }

        .result {
          margin: 0 18px 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="plugin-shell">
      <header>
        <h1>ASR Translation Plugin</h1>
        <p class="subtitle">输入讯飞 API 凭据和英文文本，直接翻译成中文。</p>
      </header>

      <form id="translation-form">
        <section class="credential-grid" aria-label="XFYUN credentials">
          <label>
            APPID
            <input id="app-id" name="appId" autocomplete="off" required />
          </label>
          <label>
            APIKey
            <input id="api-key" name="apiKey" autocomplete="off" required />
          </label>
          <label>
            APISecret
            <input id="api-secret" name="apiSecret" autocomplete="off" required />
          </label>
        </section>

        <label>
          English text
          <textarea
            id="source-text"
            name="text"
            required
            placeholder="Good morning everyone."
          ></textarea>
        </label>

        <div class="actions">
          <button id="translate-button" type="submit">Translate</button>
          <span id="status" class="status" role="status"></span>
        </div>
      </form>

      <section id="result" class="result" aria-live="polite">
        <h2>Result</h2>
        <div class="result-block">
          <span class="result-label">Normalized</span>
          <p id="normalized-text" class="result-text"></p>
        </div>
        <div class="result-block">
          <span class="result-label">Chinese</span>
          <p id="translated-text" class="result-text"></p>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#translation-form");
      const button = document.querySelector("#translate-button");
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      const normalizedText = document.querySelector("#normalized-text");
      const translatedText = document.querySelector("#translated-text");
      let subtitleStream = null;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }

      function connectSubtitleStream() {
        if (!window.EventSource) {
          console.error("Subtitle stream error", "EventSource is not supported");
          return;
        }

        subtitleStream = new EventSource("/api/subtitle/stream");

        subtitleStream.addEventListener("subtitle", (event) => {
          const subtitle = JSON.parse(event.data);
          console.log("Subtitle received:", subtitle);
        });

        subtitleStream.onerror = (error) => {
          console.error("Subtitle stream error", error);
        };
      }

      connectSubtitleStream();

      window.addEventListener("beforeunload", () => {
        if (subtitleStream) {
          subtitleStream.close();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.classList.remove("is-visible");
        setStatus("Translating...");
        button.disabled = true;

        const formData = new FormData(form);
        const payload = {
          text: formData.get("text"),
          xfyunCredentials: {
            appId: formData.get("appId"),
            apiKey: formData.get("apiKey"),
            apiSecret: formData.get("apiSecret"),
          },
        };

        try {
          const response = await fetch("/api/translate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Translation failed");
          }

          normalizedText.textContent = data.normalizedText;
          translatedText.textContent = data.translatedText;
          result.classList.add("is-visible");
          setStatus("Done");
        } catch (error) {
          setStatus(error.message || "Translation failed", true);
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
